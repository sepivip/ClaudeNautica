<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>ClaudeNautica</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    font-family:"Segoe UI",system-ui,sans-serif;color:#cfe9f2;}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;outline:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#01121b;z-index:100;
    transition:opacity .8s ease}
  #boot.hide{opacity:0;pointer-events:none}
  #boot .t{font-size:13px;letter-spacing:.42em;text-transform:uppercase;opacity:.65}
  #boot .bar{margin-top:14px;width:220px;height:2px;background:#0b3446;overflow:hidden}
  #boot .bar i{display:block;height:100%;width:0%;background:#4fd8ff;transition:width .25s}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="boot"><div style="text-align:center">
    <div class="t">ClaudeNautica</div>
    <div class="bar"><i id="bootbar"></i></div>
  </div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
